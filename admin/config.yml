# Decap CMS config for alpgures.me
# ------------------------------------------------------------------
# BEFORE DEPLOYING: replace REPO-NAME below with the actual GitHub
# Pages repo name (e.g. alpgures/alpgures.github.io), and set base_url
# to the deployed OAuth gateway worker URL (see oauth-worker.js).
# ------------------------------------------------------------------

backend:
  name: github
  repo: alpgures/alpgures.github.io
  branch: main
  base_url: https://alpgures-me-auth.guresalpdeniz.workers.dev
  auth_endpoint: auth

media_folder: "images"
public_folder: "/images"

collections:
  - name: site
    label: "Site content"
    files:
      - name: content
        label: "All site content"
        file: "data/site.json"
        fields:
          - label: "Hero"
            name: hero
            widget: object
            fields:
              - label: "\"I love\" words (rotate in the headline box)"
                name: love_words
                widget: list
                field: { label: "Word", name: word, widget: string }
              - { label: "Rotation interval, both boxes (seconds)", name: rotation_interval, widget: number, value_type: float, min: 1, max: 10 }
              - label: "Floating words (drift across the hero sky)"
                name: floating_words
                widget: list
                field: { label: "Word", name: word, widget: string }
              - { label: "Intro sentence", name: sub, widget: text }
              - { label: "Location line", name: meta, widget: string }
          - label: "About paragraphs"
            name: about
            widget: list
            field: { label: "Paragraph", name: paragraph, widget: text }
          - label: "Experience entries"
            name: experience
            widget: list
            fields:
              - { label: "Organization", name: org, widget: string }
              - { label: "Title", name: title, widget: string }
              - { label: "Dates", name: date, widget: string }
              - { label: "Location", name: place, widget: string, required: false }
              - { label: "Summary", name: summary, widget: text, required: false }
              - { label: "Website URL", name: link, widget: string, required: false }
              - { label: "Website label", name: link_label, widget: string, required: false }
              - label: "Bullets"
                name: bullets
                widget: list
                field: { label: "Bullet", name: bullet, widget: text }
          - label: "Education"
            name: education
            widget: object
            fields:
              - { label: "School", name: school, widget: string }
              - { label: "Detail (location etc.)", name: detail, widget: string, required: false }
              - { label: "Degree", name: degree, widget: string }
              - { label: "Graduation", name: graduation, widget: string }
              - { label: "Note", name: note, widget: text, required: false }
          - label: "Projects"
            name: projects
            widget: list
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Blurb", name: blurb, widget: text }
          - label: "Skills"
            name: skills
            widget: object
            fields:
              - { label: "Tools & data", name: tools, widget: text }
              - { label: "Languages", name: languages, widget: text }
          - label: "Contact"
            name: contact
            widget: object
            fields:
              - { label: "Blurb", name: blurb, widget: text, required: false }
              - { label: "Email", name: email, widget: string }
              - { label: "LinkedIn URL", name: linkedin, widget: string }
      - name: project-alpbrowser
        label: "Project: Alp Browser"
        file: "data/projects/alpbrowser.json"
        fields:
          - { label: "Title", name: title, widget: string }
          - { label: "Tagline", name: tagline, widget: text }
          - label: "Story paragraphs"
            name: story
            widget: list
            field: { label: "Paragraph", name: paragraph, widget: text }
          - label: "Facts"
            name: facts
            widget: list
            fields:
              - { label: "Label", name: label, widget: string }
              - { label: "Value", name: value, widget: string }
          - label: "Gallery images"
            name: gallery
            widget: list
            field: { label: "Image", name: image, widget: image }
          - label: "Links"
            name: links
            widget: list
            fields:
              - { label: "Label", name: label, widget: string }
              - { label: "URL", name: url, widget: string }
      - name: project-kotoban
